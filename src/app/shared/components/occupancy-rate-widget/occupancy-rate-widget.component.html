<mat-card class="occupancy-rate-widget">
  <mat-card-header>
    <mat-card-title>Hotel Occupancy Rate</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="occupancy-metrics">
      <div class="metric-row">
        <div class="current-rate">
          <div class="rate-value">{{ currentOccupancyRate }}%</div>
          <div class="rate-label">Current Month</div>
        </div>
        <div class="rate-change" [ngClass]="{'positive': isPositiveChange, 'negative': !isPositiveChange}">
          <i-feather [name]="isPositiveChange ? 'trending-up' : 'trending-down'" class="trend-icon">
          </i-feather>
          <span>{{ isPositiveChange ? '+' : '' }}{{ rateChange | number:'1.1-1' }}%</span>
        </div>
      </div>

      <div class="additional-metrics">
        <div class="metric-item">
          <span class="metric-label">Previous Month</span>
          <span class="metric-value">{{ previousMonthRate }}%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">YTD Average</span>
          <span class="metric-value">{{ yearToDateAverage }}%</span>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <apx-chart [series]="chartOptions.series!" [chart]="chartOptions.chart!" [xaxis]="chartOptions.xaxis!"
        [yaxis]="chartOptions.yaxis!" [stroke]="chartOptions.stroke!" [fill]="chartOptions.fill!"
        [dataLabels]="chartOptions.dataLabels!" [markers]="chartOptions.markers!" [grid]="chartOptions.grid!"
        [tooltip]="chartOptions.tooltip!" [colors]="chartOptions.colors!">
      </apx-chart>
    </div>
  </mat-card-content>
</mat-card>
